[package]
name = "tulpar_core"
version = "1.0.0"
edition = "2021"
authors = ["Tulpar Security <security@tulpar.dev>"]
description = "Türk Mitolojisi Temalı %100 Rust Android SMS & Çağrı Spam Engelleme Motoru (USOM 2026 Entegreli)"

[lib]
name = "tulpar_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
ureq = { version = "2.9", features = ["json", "tls"] }
url = "2.5"
chrono = "0.4"
