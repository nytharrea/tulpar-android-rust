name: Kalkan Android APK Build & Sign

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign-apk:
    name: Rust NDK + Gradle APK + V2/V3 Signature
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v6

      - name: Java 21 LTS Kurulumu (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK ve NDK Kurulumu
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: NDK r28c (28.2.13676358), SDK 37 ve Build-Tools 37.0.0 Yükle
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Rust Toolchain ve Android Hedeflerini (Targets) Kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: cargo-ndk Kurulumu
        run: cargo install cargo-ndk --locked

      - name: Rust Çekirdek Birim Testlerini Çalıştır
        working-directory: rust-core
        run: cargo test

      - name: Rust Motorunu (.so) Tüm Android Mimarileri İçin Derle
        working-directory: rust-core
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release

      - name: Gradle 9.9.1 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: İmzalanmamış Release APK'yı Derle (Gradle)
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon

      - name: Keystore Oluştur (Secret Yoksa Otomatik Üret) ve V2/V3 Şemasıyla İmzala
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS || 'tulpar123456' }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'tulpar_key' }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASS || 'tulpar123456' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > tulpar-release.jks
          else
            keytool -genkeypair -v \
              -keystore tulpar-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Tulpar Security, OU=Mobile, O=Tulpar, L=Istanbul, S=TR, C=TR"
          fi

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/tulpar-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/Tulpar-v1.0.0-signed.apk"

          $ANDROID_HOME/build-tools/37.0.0/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # Android 15/16/17+ (SDK 36/37+) uyumluluğu için V1 + V2 + V3 imza şemaları zorunlu olarak açık
          $ANDROID_HOME/build-tools/37.0.0/apksigner sign \
            --ks tulpar-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --verbose "$SIGNED_APK"

      - name: İmzalı APK'yı GitHub Actions Artifact Olarak Yükle
        uses: actions/upload-artifact@v5
        with:
          name: Tulpar-Signed-APK
          path: android/app/build/outputs/apk/release/Tulpar-v1.0.0-signed.apk

      - name: GitHub Releases Üzerinde Yayınla (Obtainium Uyumlu)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          name: "Kalkan ${{ github.ref_name }} — Akıllı SMS ve Çağrı Engelleyici"
          body: |
            ## 🛡️ Kalkan — Akıllı SMS ve Çağrı Engelleyici
            - **Sessiz Bildirim Koruması:** Mevcut SMS uygulamanızı değiştirmeden spam bildirimlerini ve sesini otomatik gizler.
            - **USOM Zararlı Adres Koruması:** 60.000+ sahte banka, kargo ve yasa dışı bahis adresini cihaz içinde engeller.
            - **Çağrı Koruması:** Gizli numaraları, yurt dışı aramaları ve 0850'li pazarlama çağrılarını telefon çalmadan durdurur.
          files: android/app/build/outputs/apk/release/Tulpar-v1.0.0-signed.apk
